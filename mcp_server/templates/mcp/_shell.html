{# Standalone page, same look as the login screen: the user arrives here from
   an assistant's browser window, outside the app chrome. The brand's colours
   come from brands.py, like the rest of the site. #}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SOP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f3ef; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-consent { background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.1);
                        padding: 40px; max-width: 480px; width: 100%; }
        .card-consent img { height: 60px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }
        .brand-color { color: {{ (brand or {}).get('primary', '#333') }}; }
        .btn-brand { background: {{ (brand or {}).get('primary', '#333') }}; color: {{ (brand or {}).get('on_primary', '#fff') }}; border: 0; }
        .btn-brand:hover { filter: brightness(.9); color: {{ (brand or {}).get('on_primary', '#fff') }}; }
        .who { background: #f8f6f4; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
        ul.perms { padding-left: 18px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card-consent">
        {% if brand %}<img src="{{ url_for('static', filename='brand/' ~ brand.id ~ '/logo.png') }}" alt="{{ brand.name }}">{% endif %}
        {% block body %}{% endblock %}
    </div>
</body>
</html>
